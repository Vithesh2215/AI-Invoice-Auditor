# -----------------------------------------------------------------------------
# Redis is a pure cache for this system: LLM completions, translations and
# accepted RAG answers, every one of them recomputable and every one with a TTL.
#
# Persistence is therefore off. Losing this container must make the system
# slower and nothing else; if it held anything that mattered, the design would
# be wrong. allkeys-lru is chosen over noeviction for the same reason - running
# out of memory should evict a cached answer, not fail a write.
# -----------------------------------------------------------------------------

maxmemory 512mb
maxmemory-policy allkeys-lru

save ""
appendonly no

timeout 0
tcp-keepalive 300

loglevel notice
